<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/work_calendar_pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="application-name" content="worCat Work Calendar">
  <meta name="worcat:version" content="v1.2.132+140">
  <meta name="worcat:updated-at" content="2026-08-31">
  <meta
    name="description"
    content="worCat Work Calendar is a Web PWA for calendar planning, ledger entries, schedules, and work tracking."
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="worCat Work Calendar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>worCat Work Calendar</title>
  <link rel="manifest" href="manifest.json">
  <link
    rel="preload"
    as="image"
    href="boot/worcat-brand-mobile.jpg"
    media="(orientation: portrait)"
    fetchpriority="high"
  >
  <link
    rel="preload"
    as="image"
    href="boot/worcat-brand-desktop.jpg"
    media="(orientation: landscape)"
    fetchpriority="high"
  >

  <style>
    :root {
      --worcat-cursor: auto;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    html,
    body,
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    canvas {
      cursor: var(--worcat-cursor) !important;
    }

    /* Keep iOS from treating an edge swipe as browser back/forward. */
    html,
    body {
      overscroll-behavior-x: none;
    }

    input,
    textarea,
    select,
    [contenteditable="true"] {
      cursor: text !important;
    }

    #worcat-boot-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 16% 14%, rgba(243, 183, 93, 0.26), transparent 34%),
        radial-gradient(circle at 84% 78%, rgba(39, 139, 126, 0.22), transparent 38%),
        linear-gradient(145deg, #f7f0df 0%, #e4f1ec 52%, #f8f4e9 100%);
      color: #183943;
      opacity: 1;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #worcat-boot-screen::before,
    #worcat-boot-screen::after {
      position: absolute;
      border-radius: 50%;
      content: '';
      pointer-events: none;
    }

    #worcat-boot-screen::before {
      width: min(58vw, 540px);
      aspect-ratio: 1;
      top: -24%;
      right: -14%;
      border: 1px solid rgba(15, 118, 110, 0.12);
      box-shadow: inset 0 0 0 30px rgba(255, 255, 255, 0.14);
    }

    #worcat-boot-screen::after {
      width: min(44vw, 380px);
      aspect-ratio: 1;
      bottom: -22%;
      left: -12%;
      background: rgba(234, 180, 80, 0.14);
    }

    #worcat-boot-screen.is-ready {
      visibility: hidden;
      opacity: 0;
    }

    .worcat-boot-stage {
      grid-area: 1 / 1;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .worcat-brand-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.96);
      animation: worcat-brand-enter 240ms ease-out forwards;
    }

    .worcat-brand-stage.is-leaving {
      pointer-events: none;
      animation: worcat-brand-leave 220ms ease-in forwards;
    }

    .worcat-brand-picture,
    .worcat-brand-image {
      display: block;
      width: 100%;
      height: 100%;
    }

    .worcat-brand-image {
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .worcat-update-card {
      width: min(92vw, 430px);
      padding: clamp(28px, 7vw, 44px);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 30px;
      visibility: hidden;
      opacity: 0;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 64px rgba(21, 70, 71, 0.18);
      backdrop-filter: blur(16px);
      pointer-events: none;
      transform: translateY(12px) scale(0.98);
      transition:
        opacity 220ms ease,
        transform 220ms ease,
        visibility 220ms ease;
    }

    .worcat-update-card.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .worcat-update-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #dcefeb;
      font: 800 13px/1 "Segoe UI", sans-serif;
      color: #0f6f70;
    }

    .worcat-update-kicker-mark {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: linear-gradient(145deg, #0f766e, #35aa96);
    }

    .worcat-update-title {
      margin: 0;
      font: 900 clamp(22px, 5.5vw, 29px)/1.3 "Trebuchet MS", "Segoe UI", sans-serif;
      color: #16484e;
    }

    .worcat-boot-message {
      min-height: 1.5em;
      margin: 10px 0 20px;
      font: 600 clamp(15px, 4vw, 17px)/1.6 "Segoe UI", sans-serif;
      color: #587078;
    }

    .worcat-update-progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.12);
    }

    .worcat-update-progress::after {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0f766e, #42b8a3, #f0b449);
      content: '';
      animation: worcat-boot-loading 1.1s ease-in-out infinite;
    }

    .worcat-boot-version {
      margin: 16px 0 0;
      font: 700 12px/1.4 "Segoe UI", sans-serif;
      color: #789099;
    }

    @keyframes worcat-boot-loading {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(275%); }
    }

    @keyframes worcat-brand-enter {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes worcat-brand-leave {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.035); }
    }

    @media (max-width: 600px) {
      .worcat-update-card {
        width: 100%;
        padding: 32px 23px;
        border-radius: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #worcat-boot-screen,
      .worcat-brand-stage,
      .worcat-brand-stage.is-leaving,
      .worcat-update-card,
      .worcat-update-progress::after {
        transition: none;
        animation: none;
      }

      .worcat-brand-stage {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main id="worcat-boot-screen" aria-busy="true" aria-live="polite">
    <section
      id="worcat-brand-stage"
      class="worcat-boot-stage worcat-brand-stage"
      role="button"
      tabindex="0"
      aria-label="worCat，點擊可跳過啟動畫面"
    >
      <picture class="worcat-brand-picture">
        <source
          media="(orientation: portrait)"
          srcset="boot/worcat-brand-mobile.jpg"
        >
        <img
          class="worcat-brand-image"
          src="boot/worcat-brand-desktop.jpg"
          alt="worCat Work Calendar"
          decoding="sync"
          fetchpriority="high"
          draggable="false"
        >
      </picture>
    </section>
    <section
      id="worcat-update-stage"
      class="worcat-boot-stage worcat-update-card"
      aria-label="worCat version check"
      aria-hidden="true"
    >
      <div class="worcat-update-kicker">
        <span class="worcat-update-kicker-mark" aria-hidden="true">&#10022;</span>
        <span>&#29256;&#26412;&#30906;&#35469;</span>
      </div>
      <h1 class="worcat-update-title">&#27491;&#22312;&#28310;&#20633;&#26368;&#26032;&#29256;&#26412;</h1>
      <p id="worcat-boot-message" class="worcat-boot-message">&#26412;&#21941;&#27491;&#22312;&#28310;&#20633;&#24037;&#20316;&#27231;&#65292;&#35531;&#31245;&#31561;&#21941;~</p>
      <div class="worcat-update-progress" aria-hidden="true"></div>
      <p id="worcat-boot-version" class="worcat-boot-version"></p>
    </section>
  </main>
  <script>
    (() => {
      const bootScreen = document.getElementById('worcat-boot-screen');
      const brandStage = document.getElementById('worcat-brand-stage');
      const updateStage = document.getElementById('worcat-update-stage');
      const bootMessage = document.getElementById('worcat-boot-message');
      const bootVersion = document.getElementById('worcat-boot-version');
      const brandVisibleMs = 5000;
      const stageTransitionMs = 220;
      const minimumUpdateVisibleMs = 420;
      let updateStageStartedAt = null;
      let completionRequested = false;
      let completionScheduled = false;

      const scheduleBootCompletion = () => {
        if (
          !completionRequested ||
          completionScheduled ||
          updateStageStartedAt === null ||
          !bootScreen ||
          bootScreen.classList.contains('is-ready')
        ) {
          return;
        }

        completionScheduled = true;
        const earliestCompletion = Math.max(
          updateStageStartedAt + stageTransitionMs,
          updateStageStartedAt + minimumUpdateVisibleMs,
        );
        const remainingDelay = Math.max(0, earliestCompletion - Date.now());
        window.setTimeout(() => {
          bootScreen.classList.add('is-ready');
          window.setTimeout(() => bootScreen.remove(), 300);
        }, remainingDelay);
      };

      const showUpdateStage = () => {
        if (updateStageStartedAt !== null) {
          return;
        }
        updateStageStartedAt = Date.now();
        brandStage?.classList.add('is-leaving');
        brandStage?.setAttribute('aria-hidden', 'true');
        updateStage?.classList.add('is-visible');
        updateStage?.setAttribute('aria-hidden', 'false');
        scheduleBootCompletion();
      };

      window.setTimeout(showUpdateStage, brandVisibleMs);
      brandStage?.addEventListener('click', showUpdateStage);
      brandStage?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          showUpdateStage();
        }
      });

      window.worcatBootScreen = {
        setStatus(message) {
          if (bootMessage && typeof message === 'string' && message.trim()) {
            bootMessage.textContent = message;
          }
        },
        setVersion(version) {
          if (bootVersion && typeof version === 'string') {
            bootVersion.textContent = version;
          }
        },
        complete() {
          if (
            completionRequested ||
            !bootScreen ||
            bootScreen.classList.contains('is-ready')
          ) {
            return;
          }
          completionRequested = true;
          scheduleBootCompletion();
        },
      };

      const edgeWidth = 56;
      let edgeTouch = null;

      document.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) {
          edgeTouch = null;
          return;
        }

        const touch = event.touches[0];
        const startsAtEdge =
          touch.clientX <= edgeWidth ||
          touch.clientX >= window.innerWidth - edgeWidth;
        edgeTouch = startsAtEdge
          ? { x: touch.clientX, y: touch.clientY }
          : null;
      }, { passive: true, capture: true });

      document.addEventListener('touchmove', (event) => {
        if (!edgeTouch || event.touches.length !== 1) {
          return;
        }

        const touch = event.touches[0];
        const deltaX = touch.clientX - edgeTouch.x;
        const deltaY = touch.clientY - edgeTouch.y;
        if (Math.abs(deltaX) <= Math.abs(deltaY) || Math.abs(deltaX) < 4) {
          return;
        }

        // Prevent only the browser's horizontal edge navigation. Flutter
        // still receives the touch stream and changes pages itself.
        event.preventDefault();
      }, { passive: false, capture: true });

      const clearEdgeTouch = () => { edgeTouch = null; };
      document.addEventListener('touchend', clearEdgeTouch, { passive: true, capture: true });
      document.addEventListener('touchcancel', clearEdgeTouch, { passive: true, capture: true });
    })();
  </script>
  <script>
    (async () => {
      const appVersion =
        document.querySelector('meta[name="worcat:' + 'version"]')?.content?.trim() ||
        'v0.0.0+0';

      // Activate the matching worker before Flutter requests main.dart.js.
      // This prevents an older worker from serving the previous app bundle
      // during the first launch immediately after a deployment.
      if ('serviceWorker' in navigator) {
        try {
          window.worcatBootScreen?.setStatus(
            '\u6b63\u5728\u540c\u6b65\u6700\u65b0\u7248\u672c\uff0c\u8acb\u7a0d\u7b49\u55b5~',
          );
          const workerUrl = new URL('app_service_worker.js', document.baseURI);
          workerUrl.searchParams.set('v', appVersion);
          const registration = await navigator.serviceWorker.register(
            workerUrl.toString(),
            { updateViaCache: 'none' },
          );

          try {
            await registration.update();
          } catch (_) {
            // The install started by register() may already be in progress.
          }

          const deadline = Date.now() + 5000;
          while (Date.now() < deadline) {
            const activeUrl = registration.active?.scriptURL
              ? new URL(registration.active.scriptURL)
              : null;
            if (
              registration.active?.state === 'activated' &&
              activeUrl?.searchParams.get('v') === appVersion
            ) {
              break;
            }
            await new Promise((resolve) => window.setTimeout(resolve, 50));
          }
        } catch (error) {
          console.debug('Service worker startup sync skipped.', error);
        }
      }

      const bootstrapUrl = new URL('flutter_bootstrap.js', document.baseURI);
      bootstrapUrl.searchParams.set('v', appVersion);
      const bootstrapScript = document.createElement('script');
      bootstrapScript.src = bootstrapUrl.toString();
      bootstrapScript.async = true;
      document.body.appendChild(bootstrapScript);
    })();
  </script>
</body>
</html>
