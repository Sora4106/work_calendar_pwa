<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/work_calendar_pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="application-name" content="worCat Work Calendar">
  <meta name="worcat:version" content="v1.2.105+113">
  <meta name="worcat:updated-at" content="2026-08-04">
  <meta
    name="description"
    content="worCat Work Calendar is a Web PWA for calendar planning, ledger entries, schedules, and work tracking."
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="worCat Work Calendar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>worCat Work Calendar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --worcat-cursor: auto;
    }

    html,
    body,
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    canvas {
      cursor: var(--worcat-cursor) !important;
    }

    /* Keep iOS from treating an edge swipe as browser back/forward. */
    html,
    body {
      overscroll-behavior-x: none;
    }

    input,
    textarea,
    select,
    [contenteditable="true"] {
      cursor: text !important;
    }
  </style>
</head>
<body>
  <script>
    (() => {
      const edgeWidth = 56;
      let edgeTouch = null;

      document.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) {
          edgeTouch = null;
          return;
        }

        const touch = event.touches[0];
        const startsAtEdge =
          touch.clientX <= edgeWidth ||
          touch.clientX >= window.innerWidth - edgeWidth;
        edgeTouch = startsAtEdge
          ? { x: touch.clientX, y: touch.clientY }
          : null;
      }, { passive: true, capture: true });

      document.addEventListener('touchmove', (event) => {
        if (!edgeTouch || event.touches.length !== 1) {
          return;
        }

        const touch = event.touches[0];
        const deltaX = touch.clientX - edgeTouch.x;
        const deltaY = touch.clientY - edgeTouch.y;
        if (Math.abs(deltaX) <= Math.abs(deltaY) || Math.abs(deltaX) < 4) {
          return;
        }

        // Prevent only the browser's horizontal edge navigation. Flutter
        // still receives the touch stream and changes pages itself.
        event.preventDefault();
      }, { passive: false, capture: true });

      const clearEdgeTouch = () => { edgeTouch = null; };
      document.addEventListener('touchend', clearEdgeTouch, { passive: true, capture: true });
      document.addEventListener('touchcancel', clearEdgeTouch, { passive: true, capture: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
